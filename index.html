<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic City Guyana | Premium Nightclub & Lounge</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mcgy: {
                            black: '#050505',
                            dark: '#111111',
                            red: '#e10600',
                            gold: '#d4af37',
                            lightGold: '#f9e596',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
        
        body {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 0%, #1a0000 0%, #000000 80%);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Neon & Gold Effects */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #e10600, 0 0 15px #e10600, 0 0 30px #e10600;
        }
        .neon-border {
            border-color: #e10600;
            box-shadow: 0 0 10px rgba(225, 6, 0, 0.5), inset 0 0 10px rgba(225, 6, 0, 0.3);
        }
        .neon-border:hover {
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.8), inset 0 0 15px rgba(225, 6, 0, 0.5);
        }
        
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gold-border {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Custom Scrolslbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #e10600; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff1a1a; }

        .glass-panel {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATA ---
        const BOTTLES = [
            { id: 'b1', name: 'Hennessy VSOP', price: '$250', type: 'Cognac', img: 'https://images.unsplash.com/photo-1614316239105-ff2a7e7bc341?w=400&auto=format&fit=crop' },
            { id: 'b2', name: 'Moët & Chandon Nectar Impérial', price: '$300', type: 'Champagne', img: 'https://images.unsplash.com/photo-1595955073105-4f4e72390dd3?w=400&auto=format&fit=crop' },
            { id: 'b3', name: 'Casamigos Reposado', price: '$280', type: 'Tequila', img: 'https://images.unsplash.com/photo-1516594915697-87eb3b1c14ea?w=400&auto=format&fit=crop' },
            { id: 'b4', name: 'Cîroc Vodka', price: '$200', type: 'Vodka', img: 'https://images.unsplash.com/photo-1609340030589-9e8a7122dfb4?w=400&auto=format&fit=crop' },
        ];

        const BARBIES = [
            { id: 's1', name: 'Diamond', status: 'Available' },
            { id: 's2', name: 'Sapphire', status: 'Available' },
            { id: 's3', name: 'Destiny', status: 'Busy' },
            { id: 's4', name: 'Lexi', status: 'Available' },
        ];

        const EVENTS = [
            { id: 1, title: 'Neon Nights', date: 'Every Friday', desc: 'The citys premier glowing experience.' },
            { id: 2, title: 'Soca Sundays', date: 'Every Sunday', desc: 'End the week with the best Caribbean vibes.' },
            { id: 3, title: 'VIP Gold Edition', date: 'Last Saturday of the Month', desc: 'Exclusive bottle service event.' },
        ];

        // --- ICONS ---
        const GlassIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h16"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/></svg>;
        const VideoIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;

        // --- MAIN COMPONENT ---
        const App = () => {
            const [view, setView] = useState('home'); // home, order, staff
            const [orders, setOrders] = useState([]);
            const [isAuthenticated, setIsAuthenticated] = useState(false); // Staff authentication state
            
            // Order Form State
            const [selectedBottle, setSelectedBottle] = useState(null);
            const [selectedBarbie, setSelectedBarbie] = useState(null);
            const [tableNumber, setTableNumber] = useState('');

            const handleOrderSubmit = (e) => {
                e.preventDefault();
                if(!selectedBottle || !selectedBarbie || !tableNumber) return alert('Please complete all fields.');
                
                const newOrder = {
                    id: Math.random().toString(36).substr(2, 9),
                    bottle: BOTTLES.find(b => b.id === selectedBottle).name,
                    barbie: BARBIES.find(s => s.id === selectedBarbie).name,
                    table: tableNumber,
                    status: 'Pending',
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                };
                
                setOrders([newOrder, ...orders]);
                setView('home');
                setSelectedBottle(null);
                setSelectedBarbie(null);
                setTableNumber('');
                
                // Show custom modal instead of alert in a real app, but using a quick timeout for prototype
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-5 right-5 bg-mcgy-red text-white px-6 py-3 rounded-lg shadow-lg z-50 neon-border animate-bounce';
                toast.innerText = 'Order Placed Successfully!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            };

            const completeOrder = (id) => {
                setOrders(orders.map(o => o.id === id ? { ...o, status: 'Delivered' } : o));
            };

            // --- SUB-COMPONENTS ---
            const Navbar = () => (
                <nav className="fixed w-full z-50 glass-panel border-b border-white/10 transition-all duration-300">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            {/* Brand / Home Link */}
                            <div className="flex items-center cursor-pointer" onClick={() => setView('home')}>
                                <span className="font-sans font-black text-3xl tracking-tighter text-white uppercase">
                                    <span className="text-mcgy-red">M</span>CGY
                                </span>
                            </div>
                            
                            {/* Nav Links */}
                            <div className="hidden md:flex space-x-8 items-center">
                                <button onClick={() => setView('home')} className={`text-sm uppercase tracking-widest hover:text-mcgy-red transition ${view === 'home' ? 'text-mcgy-red' : 'text-gray-300'}`}>Website</button>
                                <button onClick={() => setView('order')} className={`text-sm uppercase tracking-widest hover:text-mcgy-red transition ${view === 'order' ? 'text-mcgy-red' : 'text-gray-300'}`}>Bottle Service</button>
                                <button onClick={() => setView('staff')} className={`text-sm uppercase tracking-widest hover:text-mcgy-gold transition ${view === 'staff' ? 'text-mcgy-gold' : 'text-gray-500'}`}>Staff Portal</button>
                            </div>

                            {/* Mobile Menu Button (Simplified for prototype) */}
                            <div className="md:hidden flex items-center space-x-4">
                                <button onClick={() => setView('order')} className="text-mcgy-red">Order</button>
                                <button onClick={() => setView('staff')} className="text-gray-500">Staff</button>
                            </div>
                        </div>
                    </div>
                </nav>
            );

            const HomeView = () => (
                <div className="pt-20 pb-0">
                    {/* Hero Banner with Logo */}
                    <div className="relative w-full min-h-[70vh] flex flex-col items-center justify-center py-20 px-4 bg-black border-b-4 border-mcgy-red relative overflow-hidden">
                        {/* Background Glow */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-mcgy-red/20 blur-[120px] rounded-full pointer-events-none"></div>
                        <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] pointer-events-none"></div>
                        
                        {/* Update 'your_file_name.png' to your actual file name */}
                        <img 
                            src="\resources\images\mcgy-logo_transp.png" 
                            alt="Magic City Guyana Banner" 
                            className="max-w-[90%] md:max-w-4xl lg:max-w-5xl w-full drop-shadow-[0_0_40px_rgba(225,6,0,0.5)] relative z-10 mb-12 object-contain"
                        />
                        
                        <p className="text-gray-300 text-center max-w-2xl mx-auto text-xl md:text-2xl leading-relaxed relative z-10 font-bold tracking-widest uppercase">
                            The Blueprint of Premium Nightlife.
                        </p>
                        
                        <div className="mt-12 flex gap-4 relative z-10">
                            <button onClick={() => setView('order')} className="bg-mcgy-red text-white font-black px-10 py-4 rounded-none uppercase tracking-[0.2em] text-sm hover:bg-white hover:text-black transition-all duration-300 shadow-[0_0_20px_rgba(225,6,0,0.6)]">
                                Enter Bottle Service
                            </button>
                        </div>
                    </div>

                    {/* Events & VIP Section */}
                    <div className="max-w-7xl mx-auto px-4 py-24 grid md:grid-cols-2 gap-16">
                        <div>
                            <h2 className="text-4xl font-black uppercase tracking-wider text-white mb-10 border-l-8 border-mcgy-red pl-6">Upcoming Events</h2>
                            <div className="space-y-6">
                                {EVENTS.map(ev => (
                                    <div key={ev.id} className="glass-panel p-6 rounded-none border border-white/5 hover:border-mcgy-red transition duration-300">
                                        <h3 className="gold-text font-black uppercase text-2xl tracking-wider mb-2">{ev.title}</h3>
                                        <p className="text-mcgy-red text-sm mb-4 uppercase tracking-[0.2em] font-bold">{ev.date}</p>
                                        <p className="text-gray-400 text-sm font-light">{ev.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        <div>
                            <h2 className="text-4xl font-black uppercase tracking-wider text-white mb-10 border-l-8 border-mcgy-gold pl-6">VIP Gallery</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <img src="https://images.unsplash.com/photo-1566737236500-c8ac43014a67?w=500&auto=format&fit=crop" className="rounded-none h-48 w-full object-cover opacity-70 hover:opacity-100 transition duration-300 border border-white/10" alt="Club Scene" />
                                <img src="https://images.unsplash.com/photo-1574169208507-84376144848b?w=500&auto=format&fit=crop" className="rounded-none h-48 w-full object-cover opacity-70 hover:opacity-100 transition duration-300 border border-white/10" alt="VIP Bottles" />
                                <img src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=500&auto=format&fit=crop" className="rounded-none h-48 w-full object-cover opacity-70 hover:opacity-100 transition duration-300 border border-white/10" alt="Party" />
                                <img src="https://images.unsplash.com/photo-1516997121675-4c2d1684aa3e?w=500&auto=format&fit=crop" className="rounded-none h-48 w-full object-cover opacity-70 hover:opacity-100 transition duration-300 border border-white/10" alt="Drinks" />
                            </div>
                        </div>
                    </div>

                    {/* Phone a Barbie Section (Bottom) */}
                    <div className="w-full bg-[#0a0a0a] py-32 border-t-4 border-mcgy-red relative overflow-hidden">
                        <div className="absolute right-0 top-0 w-full md:w-1/2 h-full bg-gradient-to-l from-mcgy-red/20 to-transparent pointer-events-none"></div>
                        <div className="max-w-5xl mx-auto px-4 text-center relative z-10">
                            <div className="inline-flex items-center justify-center p-6 bg-black rounded-full border-2 border-mcgy-red mb-8 neon-border text-mcgy-red shadow-[0_0_30px_rgba(225,6,0,0.4)]">
                                <VideoIcon />
                            </div>
                            <h2 className="text-5xl md:text-7xl font-black uppercase tracking-tighter text-white mb-6">Phone a <span className="text-mcgy-red neon-text">Barbie</span></h2>
                            <p className="text-gray-300 text-lg md:text-2xl mb-12 max-w-3xl mx-auto font-light tracking-wide">
                                Experience the allure of Magic City from anywhere. Connect with our exclusive Barbies for a private, premium video chat experience. 
                            </p>
                            
                            <div className="glass-panel inline-block p-10 md:p-16 rounded-none border-2 border-mcgy-gold/50 shadow-[0_0_40px_rgba(212,175,55,0.15)]">
                                <p className="uppercase tracking-[0.3em] font-bold text-sm text-mcgy-gold mb-4">Secure Your Session</p>
                                <p className="text-5xl md:text-7xl font-black text-white mb-8 tracking-widest neon-text">592-XXX</p>
                                
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-6 text-sm text-gray-300 bg-black py-5 px-10 rounded-none border border-white/10">
                                    <span className="uppercase tracking-widest text-xs text-gray-500 font-bold">Payments:</span>
                                    <span className="text-[#00457C] font-black text-xl tracking-wider bg-white px-3 py-1 rounded-sm">PayPal</span>
                                    <span className="hidden sm:inline text-gray-600">&bull;</span>
                                    <span className="text-mcgy-red font-black text-2xl tracking-wider">MMG</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-black py-8 text-center border-t border-white/10">
                        <p className="text-gray-600 text-sm">&copy; 2026 Magic City Guyana. All Rights Reserved.</p>
                    </footer>
                </div>
            );

            const OrderView = () => (
                <div className="pt-24 pb-20 max-w-5xl mx-auto px-4 min-h-screen">
                    <div className="text-center mb-16">
                        <h2 className="text-5xl font-black uppercase tracking-tight text-white mb-4">Digital Bottle Service</h2>
                        <p className="text-mcgy-red font-bold uppercase tracking-[0.3em] text-sm">Select your premium bottle and your Barbie</p>
                    </div>

                    <form onSubmit={handleOrderSubmit} className="space-y-12">
                        {/* 1. Bottle Selection */}
                        <div className="glass-panel p-8 rounded-none border border-white/5">
                            <h3 className="text-2xl font-black uppercase tracking-wider text-white mb-8 flex items-center gap-3 border-b border-white/10 pb-4">
                                <span className="bg-mcgy-red text-white w-10 h-10 rounded-none flex items-center justify-center text-lg font-black">1</span>
                                Choose Your Bottle
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {BOTTLES.map(bottle => (
                                    <div 
                                        key={bottle.id} 
                                        onClick={() => setSelectedBottle(bottle.id)}
                                        className={`cursor-pointer rounded-none overflow-hidden border-2 transition-all ${selectedBottle === bottle.id ? 'border-mcgy-red shadow-[0_0_20px_rgba(225,6,0,0.4)] bg-mcgy-red/10' : 'border-white/10 bg-black hover:border-white/30'}`}
                                    >
                                        <div className="h-40 overflow-hidden relative">
                                            <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent z-10"></div>
                                            <img src={bottle.img} alt={bottle.name} className="w-full h-full object-cover opacity-60" />
                                        </div>
                                        <div className="p-5 text-center">
                                            <p className="font-black uppercase tracking-wider text-white text-sm mb-2">{bottle.name}</p>
                                            <p className="gold-text font-black text-xl">{bottle.price}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 2. Barbie Selection */}
                        <div className="glass-panel p-8 rounded-none border border-white/5">
                            <h3 className="text-2xl font-black uppercase tracking-wider text-white mb-8 flex items-center gap-3 border-b border-white/10 pb-4">
                                <span className="bg-mcgy-red text-white w-10 h-10 rounded-none flex items-center justify-center text-lg font-black">2</span>
                                Select Your Barbie (Server)
                            </h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {BARBIES.map(barbie => (
                                    <div 
                                        key={barbie.id} 
                                        onClick={() => barbie.status === 'Available' && setSelectedBarbie(barbie.id)}
                                        className={`p-6 rounded-none text-center border-2 transition-all ${barbie.status !== 'Available' ? 'opacity-50 cursor-not-allowed border-transparent bg-black/50' : selectedBarbie === barbie.id ? 'border-mcgy-gold bg-mcgy-gold/10 shadow-[0_0_20px_rgba(212,175,55,0.3)] cursor-pointer' : 'border-white/10 bg-black cursor-pointer hover:border-white/30'}`}
                                    >
                                        <div className="w-16 h-16 rounded-full bg-zinc-900 mx-auto mb-4 flex items-center justify-center border-2 border-white/10">
                                            <GlassIcon />
                                        </div>
                                        <p className="font-black uppercase tracking-wider text-white text-sm">{barbie.name}</p>
                                        <p className={`text-xs mt-2 uppercase tracking-widest font-bold ${barbie.status === 'Available' ? 'text-green-500' : 'text-mcgy-red'}`}>{barbie.status}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 3. Table & Submit */}
                        <div className="glass-panel p-8 rounded-none border border-white/5 flex flex-col md:flex-row items-end gap-6">
                            <div className="flex-1 w-full">
                                <label className="block text-gray-400 text-xs font-bold uppercase tracking-[0.2em] mb-3">Table / Section Number</label>
                                <input 
                                    type="text" 
                                    value={tableNumber}
                                    onChange={(e) => setTableNumber(e.target.value)}
                                    placeholder="e.g. VIP-4"
                                    className="w-full bg-black border-2 border-white/10 rounded-none px-5 py-4 text-white font-bold focus:outline-none focus:border-mcgy-red focus:shadow-[0_0_15px_rgba(225,6,0,0.3)] transition-all"
                                    required
                                />
                            </div>
                            <button 
                                type="submit" 
                                className="w-full md:w-auto bg-mcgy-red text-white px-12 py-4 rounded-none uppercase tracking-[0.2em] font-black hover:bg-white hover:text-black transition-all duration-300 shadow-[0_0_20px_rgba(225,6,0,0.5)] h-[56px]"
                            >
                                Dispatch Order
                            </button>
                        </div>
                    </form>
                </div>
            );

            const StaffDashboard = () => (
                <div className="pt-24 pb-20 max-w-6xl mx-auto px-4 min-h-screen">
                    <div className="flex justify-between items-center mb-10 border-b-2 border-white/10 pb-6">
                        <div>
                            <h2 className="text-4xl font-black uppercase tracking-wider text-white">Staff Terminal</h2>
                            <p className="text-mcgy-red font-bold uppercase tracking-[0.2em] text-sm mt-2">Live Order Feed</p>
                        </div>
                        <div className="bg-black border border-white/10 px-5 py-3 rounded-none text-xs font-bold uppercase tracking-widest text-gray-400 flex items-center gap-3">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            System Online
                        </div>
                    </div>

                    {orders.length === 0 ? (
                        <div className="text-center py-20 glass-panel rounded-2xl">
                            <p className="text-gray-500 text-lg">No active orders at this time.</p>
                        </div>
                    ) : (
                        <div className="grid gap-4">
                            {orders.map(order => (
                                <div key={order.id} className={`glass-panel p-6 rounded-xl border-l-4 flex flex-col md:flex-row justify-between items-center gap-4 transition-all ${order.status === 'Pending' ? 'border-mcgy-red' : 'border-green-500 opacity-60'}`}>
                                    <div className="flex-1 grid grid-cols-2 md:grid-cols-4 gap-4 w-full text-sm">
                                        <div>
                                            <p className="text-gray-500 uppercase text-xs mb-1">Time</p>
                                            <p className="text-white font-mono">{order.time}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 uppercase text-xs mb-1">Location</p>
                                            <p className="text-white font-bold text-lg">{order.table}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 uppercase text-xs mb-1">Order</p>
                                            <p className="gold-text font-bold">{order.bottle}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 uppercase text-xs mb-1">Barbie Assigned</p>
                                            <p className="text-white">{order.barbie}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="w-full md:w-auto flex justify-end">
                                        {order.status === 'Pending' ? (
                                            <button 
                                                onClick={() => completeOrder(order.id)}
                                                className="bg-transparent border border-green-500 text-green-500 hover:bg-green-500 hover:text-white px-6 py-2 rounded uppercase tracking-wider text-xs font-bold transition flex items-center gap-2 w-full justify-center"
                                            >
                                                <CheckIcon /> Mark Delivered
                                            </button>
                                        ) : (
                                            <span className="text-green-500 font-bold tracking-wider uppercase text-sm flex items-center gap-1">
                                                <CheckIcon /> Delivered
                                            </span>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            const StaffLogin = () => {
                const [input, setInput] = useState('');
                const [error, setError] = useState(false);

                const handleLogin = (e) => {
                    e.preventDefault();
                    // Hardcoded password for prototype: "magic123"
                    if (input === 'magic123') { 
                        setIsAuthenticated(true);
                        setError(false);
                    } else {
                        setError(true);
                        setInput('');
                    }
                };

                return (
                    <div className="pt-32 pb-20 max-w-md mx-auto px-4 min-h-[70vh] flex flex-col items-center justify-center">
                        <div className="glass-panel p-8 rounded-none border border-mcgy-red/50 w-full shadow-[0_0_30px_rgba(225,6,0,0.2)] relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-mcgy-red via-mcgy-gold to-mcgy-red"></div>
                            <h2 className="text-3xl font-black uppercase tracking-wider text-white mb-6 text-center">Staff Access</h2>
                            <p className="text-gray-400 text-xs text-center mb-6 tracking-widest uppercase">Authorized Personnel Only</p>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <input 
                                        type="password" 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        className="w-full bg-black border-2 border-white/10 rounded-none px-5 py-4 text-white font-bold focus:outline-none focus:border-mcgy-red transition-all text-center tracking-[0.5em]"
                                        placeholder="••••••••"
                                        autoFocus
                                    />
                                    {error && <p className="text-mcgy-red text-xs mt-2 font-bold uppercase tracking-widest text-center animate-pulse">Invalid Passcode</p>}
                                </div>
                                <button 
                                    type="submit" 
                                    className="w-full bg-mcgy-red text-white px-6 py-4 rounded-none uppercase tracking-[0.2em] font-black hover:bg-white hover:text-black transition-all shadow-[0_0_15px_rgba(225,6,0,0.4)]"
                                >
                                    Enter Terminal
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };

            // Render view based on state
            return (
                <div className="relative min-h-screen">
                    <Navbar />
                    {view === 'home' && <HomeView />}
                    {view === 'order' && <OrderView />}
                    {view === 'staff' && (isAuthenticated ? <StaffDashboard /> : <StaffLogin />)}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
